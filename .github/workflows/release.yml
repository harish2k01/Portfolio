name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for semantic-release to access full commit history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install -g semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/github

      - name: Configure Git with token
        run: |
          git config --global user.email "t.harish2478@gmail.com"
          git config --global user.name "semantic-release-bot"
          git config --global credential.helper ""
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/harish2k01/Portfolio.git

      - name: Debug Git setup
        run: |
          echo "Checking git config and remotes..."
          git config --list --show-origin
          git remote -v

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Running semantic-release..."
          npx semantic-release > release-log.txt
          VERSION=$(grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' release-log.txt | tail -1 || echo "")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
