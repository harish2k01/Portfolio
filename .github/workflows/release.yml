name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write        # Required to push tags and commits
  issues: write          # Required for GitHub releases
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for full git history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install -g semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/github

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx semantic-release > release-log.txt
          VERSION=$(grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' release-log.txt | tail -1 || echo "")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
