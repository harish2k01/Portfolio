name: Dev Release

on:
  push:
    branches: [dev]

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  release-dev:
    name: Dev Deployment Semantic Versioning
    runs-on: portfolio-runner
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      released: ${{ steps.semantic.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'

      - name: Install semantic-release and plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec

      - name: Run semantic-release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-dev:
    name: Build and Publish Dev Image
    needs: release-dev
    runs-on: portfolio-runner
    if: needs.release-dev.outputs.released == 'true'
    environment: Dev

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: v${{ needs.release-dev.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/harish2k01/portfolio:${{ needs.release-dev.outputs.version }}
            ghcr.io/harish2k01/portfolio:dev
          labels: |
            org.opencontainers.image.source=https://github.com/harish2k01/Portfolio
            org.opencontainers.image.description=Portfolio
            org.opencontainers.image.licenses=MIT

  update-homelab-ops-dev:
    name: Update homelab-ops Dev Version
    needs:
      - release-dev
      - build-and-publish-dev
    if: needs.release-dev.outputs.released == 'true'
    uses: harish2k01/homelab-ops/.github/workflows/update-version.yaml@main
    with:
      app_name: portfolio-dev
      image_tag: ${{ needs.release-dev.outputs.version }}
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  trigger-jenkins-dev:
    name: Trigger Jenkins Dev Deploy
    needs:
      - release-dev
      - build-and-publish-dev
      - update-homelab-ops-dev
    runs-on: portfolio-runner
    if: needs.release-dev.outputs.released == 'true'
    environment: Dev

    steps:
      - name: Trigger Jenkins Dev Job
        run: |
          curl -X POST "${{ secrets.JENKINS_URL }}/job/${{ secrets.JENKINS_JOB_DEV }}/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode "VERSION=${{ needs.release-dev.outputs.version }}" \
            --data-urlencode "SERVER_URL=${{ secrets.SERVER_URL }}"
