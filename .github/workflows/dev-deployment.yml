name: Dev Release

on:
  push:
    branches: [dev]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-dev:
    name: Dev Deployment Semantic Versioning
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      released: ${{ steps.semantic.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'

      - name: Install semantic-release and plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec

      - name: Run semantic-release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-jenkins-dev:
    name: Trigger Jenkins Dev Build
    needs: release-dev
    runs-on: ubuntu-latest
    if: needs.release-dev.outputs.released == 'true'
    environment: Dev

    steps:
      - name: Trigger Jenkins Dev Job
        run: |
          curl -X POST "${{ secrets.JENKINS_URL }}/job/${{ secrets.JENKINS_JOB_DEV }}/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode "VERSION=${{ needs.release-dev.outputs.version }}" \
            --data-urlencode "GITHUB_SHA=${{ github.sha }}" \
            --data-urlencode "SERVER_URL=${{ secrets.SERVER_URL }}"
