name: Production Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

env:
  # Homelab runners pull Docker Hub images through zot and npm packages through Verdaccio.
  BUILDKIT_MIRROR_CONFIG: |
    [registry."docker.io"]
      mirrors = ["zot.zot.svc.cluster.local:5000"]
    [registry."zot.zot.svc.cluster.local:5000"]
      http = true
  HOMELAB_NPM_REGISTRY: http://verdaccio.verdaccio.svc.cluster.local:4873/
jobs:
  release-prod:
    name: Prod Deployment Semantic Versioning
    runs-on: portfolio-runner
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      released: ${{ steps.semantic.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'

      - name: Run semantic-release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-prod:
    name: Build and Publish Prod Image
    needs: release-prod
    runs-on: portfolio-runner
    if: needs.release-prod.outputs.released == 'true'
    environment: Production

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: v${{ needs.release-prod.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
        with:
          driver-opts: network=host
          buildkitd-config-inline: ${{ runner.environment == 'self-hosted' && env.BUILDKIT_MIRROR_CONFIG || '' }}

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/harish2k01/portfolio:${{ needs.release-prod.outputs.version }}
            ghcr.io/harish2k01/portfolio:latest
          labels: |
            org.opencontainers.image.source=https://github.com/harish2k01/Portfolio
            org.opencontainers.image.description=Portfolio
            org.opencontainers.image.licenses=MIT
          build-args: |
            NPM_CONFIG_REGISTRY=${{ runner.environment == 'self-hosted' && env.HOMELAB_NPM_REGISTRY || 'https://registry.npmjs.org/' }}

  update-homelab-ops-prod:
    name: Update homelab-ops Prod Version
    needs:
      - release-prod
      - build-and-publish-prod
    if: needs.release-prod.outputs.released == 'true'
    uses: harish2k01/homelab-ops/.github/workflows/update-version.yaml@main
    with:
      app_name: portfolio-prod
      image_tag: ${{ needs.release-prod.outputs.version }}
      runner: portfolio-runner
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
